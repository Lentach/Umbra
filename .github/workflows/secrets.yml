name: Secret scan

# Plan D5: gitleaks in CI, not only in the local pre-commit hook (which a clone
# without `core.hooksPath`, a machine without gitleaks, or `--no-verify` skips).
#
# Its own workflow on purpose: ci.yml's `paths-ignore` skips commits that touch
# only `.cursor/**` and `docs/**`, and the one real secret this repo ever
# published (a contact-inbox key, rotated in 10f733d1) was in a session summary.
# So this runs on EVERY push to master and every pull request, and scans the
# whole history (about 2 s). Known dead findings are fingerprinted in
# `.gitleaksignore`; a fingerprint names one commit, so a new leak always fails.
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned release + checksum (the same 8.30.1 the dev PC's hook runs).
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner --verbose .
