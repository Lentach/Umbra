# Production compose for the Fireplace VM. Self-contained (db + backend).
# Deploy with:  ./deploy-backend.sh   (runs: docker compose -f docker-compose.prod.yml ...)
#
# Do NOT use the dev docker-compose.yml on the VM — that runs the backend
# bind-mounted in watch mode (NODE_ENV=development), which relaxes CORS and
# enables TypeORM auto-DDL (synchronize) on the live database.
#
# This file runs the backend from a BUILT image (NODE_ENV=production):
#   - CORS is restricted to ALLOWED_ORIGINS
#   - media URLs are built from MEDIA_BASE_URL
#   - TypeORM synchronize is OFF (schema changes need manual SQL — see backend/CLAUDE.md)
#
# Required keys in ~/fireplace/.env (compose interpolates them; deploy aborts if missing):
#   ALLOWED_ORIGINS, MEDIA_BASE_URL, JWT_SECRET,
#   WEB_PUSH_VAPID_PUBLIC_KEY, WEB_PUSH_VAPID_PRIVATE_KEY
# Set by deploy-backend.sh:  APP_VERSION, GIT_COMMIT, BUILD_TIME
# Optional:  FIREBASE_SERVICE_ACCOUNT, WEB_PUSH_VAPID_SUBJECT, DB_USER/DB_PASS/DB_NAME

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # pg_stat_statements (bundled in postgres:16): answers "which query is slow" with
    # no egress. Takes effect on the next db recreate (deploy-backend.sh `up -d`), then
    # ONCE per database:  docker compose -f docker-compose.prod.yml exec db \
    #   psql -U postgres -d chatdb -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
    # max=1000 bounds the shared-memory slice (~1 MB) on the 4 GB VM.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.max=1000", "-c", "pg_stat_statements.track=top"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # NOTE: postgres applies POSTGRES_* only on FIRST init of an empty pgdata
      # volume; rotating DB_* on an already-provisioned VM needs a manual ALTER ROLE.
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-chatdb}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-0.0.1}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
    image: fireplace-backend:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      # MUST be UTC, and pinned rather than inherited from the base image.
      # `messages.expiresAt` / `createdAt` are `timestamp WITHOUT time zone`, so
      # node-postgres parses them as LOCAL time. On a non-UTC backend every
      # deadline is serialised shifted by the host offset, while the client's
      # `socketReady.serverTime` stays correct — so the client would destroy
      # expired plaintext HOURS EARLY. That plaintext is the only copy (the
      # server keeps ciphertext whose ratchet key is consumed), so the loss is
      # permanent. Alpine happens to default to UTC; do not rely on that.
      TZ: UTC
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-chatdb}
      # Generate once and persist in ~/fireplace/.env + encrypted backups.
      # If exposed, rotate after sticky refresh deploy; refresh tokens survive it.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in ~/fireplace/.env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in ~/fireplace/.env (e.g. https://fireplace.ignorelist.com)}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:?set MEDIA_BASE_URL in ~/fireplace/.env (e.g. https://fireplace.ignorelist.com)}
      MEDIA_DIR: /app/media
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:?set WEB_PUSH_VAPID_PUBLIC_KEY in ~/fireplace/.env}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:?set WEB_PUSH_VAPID_PRIVATE_KEY in ~/fireplace/.env}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-mailto:admin@example.com}
      # Landing contact form: Web Push ping target (optional; unset = store-only)
      CONTACT_NOTIFY_USER_ID: ${CONTACT_NOTIFY_USER_ID:-}
      # Landing contact form: secret key guarding /contact/inbox (hex, >=32 chars)
      CONTACT_INBOX_KEY: ${CONTACT_INBOX_KEY:-}
      APP_VERSION: ${APP_VERSION:-0.0.1}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      BUILD_TIME: ${BUILD_TIME:-}
      # Sideloaded APK channel, served by GET /version as the `android` block
      # so an installed APK can learn a newer one exists. Unset = no channel
      # published and the client prompts nobody, which is the correct state
      # between APK releases.
      ANDROID_APK_VERSION_CODE: ${ANDROID_APK_VERSION_CODE:-}
      ANDROID_APK_VERSION_NAME: ${ANDROID_APK_VERSION_NAME:-}
      ANDROID_APK_URL: ${ANDROID_APK_URL:-}
      NODE_ENV: production
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - media_storage:/app/media

volumes:
  pgdata:
  media_storage:
