# Analyzer + lint config. Base set: very_good_analysis 10.3.0 (workflow-2.0 Batch 8.6,
# 2026-09-12; 11 needs Dart ^3.13, the box is 3.12). Debt is RATCHETED, not gated:
# `node scripts/dart-lint-ratchet.mjs` (CI) fails only when the info count rises above
# scripts/dart-lint-baseline.json. Pay debt in the files you touch; `--update` lowers
# the floor. Never run a whole-tree `dart fix --apply` to "clear" it (root CLAUDE.md §1).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # Vendored upstream code (pubspec dependency_overrides) keeps upstream's style.
  exclude:
    - third_party/**
  language:
    # VGA turns these on. strict-casts produced 11 hard errors and strict-inference 59
    # warnings on 2026-09-12, all `dynamic` flowing into typed crypto params
    # (link_ceremony_controller.dart, connection_provider.dart, messaging history).
    # Those are E2EE-path code changes, not lint config, so they stay off until fixed
    # deliberately under frontend/docs/e2e-invariants.md. Flip each to true then.
    strict-casts: false
    strict-inference: false
    strict-raw-types: true

linter:
  rules:
    # Deliberate conventions of this codebase, not debt:
    # - relative imports inside lib/ (992 sites; a package-import migration is a
    #   whole-tree rewrite with zero behaviour change).
    always_use_package_imports: false
    # - this is an app, not a published package; VGA's own README says to disable
    #   for apps (1 658 undocumented public members are screens/widgets/providers).
    public_member_api_docs: false
    # - line length is left to the editor; `dart format` is never run whole-tree.
    lines_longer_than_80_chars: false
