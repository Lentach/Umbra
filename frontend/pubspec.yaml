name: fireplace
description: "Fireplace - real-time messenger."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# App version: semver only (0.0.1, 0.0.2, 0.0.3, …). Bump PATCH by +1 on each release (see root CLAUDE.md §5).
# Do not add a +suffix here — that is Flutter build metadata, not our user-visible version.
version: 0.2.51

environment:
  sdk: ^3.10.7
  # Exact pin: CI reads this via flutter-version-file so it tests the SDK the dev box runs
  # (3.44.6 ↔ Dart 3.12.2). Bump deliberately, here, not by letting CI float.
  flutter: 3.44.6

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  socket_io_client: ^3.1.6
  http: ^1.2.2
  google_fonts: ^8.2.1
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.3.4
  # Runtime, not test-only: the plaintext record store reads through the
  # platform store directly instead of SharedPreferences' in-memory cache.
  # `reload()` clears that cache and refills it from a snapshot taken across an
  # await, so a write landing in the window is dropped from the cache while it
  # survives in the backing store — and a missed plaintext record re-decrypts a
  # consumed ratchet key into a permanent "[Decryption failed]".
  shared_preferences_platform_interface: ^2.4.2
  package_info_plus: ^8.3.0
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  cross_file: ^0.3.4
  # PR2.3 history backup: the ONLY way an exported file reaches the user on
  # Android 11+. `path_provider` can write it, but app-private storage is not
  # reachable by a file manager, so a "saved" backup nobody can find is not a
  # backup. Web does not use this — it takes the browser download path.
  share_plus: ^12.0.0
  http_parser: ^4.0.2

  just_audio: ^0.10.6
  # Video messages: lazy per-tap playback (web: blob URL, native: temp file).
  video_player: ^2.10.0
  path_provider: ^2.1.6
  record: ^5.0.0
  permission_handler: ^11.0.0
  url_launcher: ^6.3.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  web: ^1.1.0
  fast_thumbhash: ^1.2.1
  libsignal_protocol_dart: ^0.8.2
  flutter_secure_storage: ^9.2.4
  # PINNED: >=0.6.1 switched to a native-assets hook that builds windows-x64 on
  # every local `flutter test` and needs CMake (installed) PLUS the MSVC C++
  # toolchain (multi-GB, NOT installed). Nothing ships from that asset: prod web
  # uses the JS/WebCrypto path, Android builds via Gradle/NDK. Unpin only if a
  # future version carries something needed AND VS Build Tools C++ is installed.
  webcrypto: 0.6.0
  flutter_local_notifications: ^22.3.0
  flutter_web_plugins:
    sdk: flutter
  emoji_picker_flutter: ^4.5.4
  characters: ^1.4.1
  # Direct because ConnectionProvider reads clock.now() for the serverTime
  # retry floor — package:clock is what fake_async overrides, so the floor is
  # deterministic under test while DateTime.now() would not be.
  clock: ^1.1.2
  skeletonizer: ^2.1.3
  # Encrypted native content store. These bounds are load-bearing, not
  # cosmetic: drift >=2.32 and sqlite3 3.x moved to native-assets BUILD HOOKS,
  # which demand MSVC on every local `flutter test` on Windows — the exact trap
  # webcrypto 0.6.1 set (see frontend/CLAUDE.md §5). `^2.31.0` would have
  # allowed 2.32 on the next `pub upgrade`, so the upper bound is explicit.
  drift: ">=2.31.0 <2.32.0"
  sqlite3: ">=2.9.0 <3.0.0"
  sqlcipher_flutter_libs: ^0.6.8
  bip39_mnemonic: ^4.1.0
  # T3 link ceremony crypto (spec §5.1 / §12 item (ii)): HKDF-SHA256 rides
  # `crypto`'s HMAC, AES-256-CBC/PKCS7 rides `pointycastle` — the same engine
  # libsignal itself uses internally (its cbc.dart helpers are not exported
  # from the barrel). Both already resolved in the lock (crypto transitively,
  # pointycastle as a dev dep), so this is promotion, not a new pin.
  crypto: ^3.0.0
  pointycastle: ^4.0.0
  # Metadata-privacy PR1.2 (the box client): pure Ed25519 (RFC 8032), the ONE
  # signature the box's node `crypto.verify` checks — libsignal's XEdDSA is a
  # different scheme. Already resolved in the lock through libsignal, so this
  # is promotion, not a new pin (same move as `crypto`/`pointycastle`).
  ed25519_edwards: ^0.3.1
  qr_flutter: ^4.1.0
  # (lxxvii) clause 3: native QR scanning (CameraX/ML Kit on Android). Web
  # deliberately does NOT use this package's scanner — its web impl fetches
  # ZXing at runtime; the web path is lib/widgets/link_qr_scanner_web.dart
  # (BarcodeDetector → vendored web/jsqr.js), never a runtime CDN.
  mobile_scanner: ^7.4.0
  light_compressor_v2: ^1.9.1
  pointer_interceptor: ^0.10.1+2

dependency_overrides:
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device acceptance for the encrypted content store (Phase 2): real
  # Keystore, real SQLCipher .so, real webcrypto — run against an emulator:
  #   flutter test integration_test -d <deviceId>
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  fake_async: ^1.3.3
  url_launcher_platform_interface: ^2.3.2
  # Same upper bound as `drift` above — a drift_dev that outruns the runtime
  # package would regenerate `content_db.g.dart` against a version this app
  # deliberately does not use.
  drift_dev: ">=2.31.0 <2.32.0"
  build_runner: ^2.15.1
  very_good_analysis: 10.3.0
  patrol: 4.9.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/sounds/
    - assets/icon/
    - assets/giphy/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Patrol E2E runner (workflow-2.0 Batch 8.2): `patrol test -t integration_test/<file> -d <device>`.
# Only `patrolTest(...)` files run under it (the existing testWidgets *_device_test.dart files
# keep `flutter test integration_test -d <id>`); proven on Android, web leg open — frontend/CLAUDE.md §1.
patrol:
  app_name: Fireplace
  test_directory: integration_test
  android:
    package_name: com.fireplace.app
