<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="description" content="Umbra - real-time messenger">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Umbra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Umbra</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Match the default (Hot Stone / light) theme background. Android PWA
       keyboard hide resizes the OS window and Chrome exposes the reclaimed
       strip before Flutter's canvas grows to cover it (flutter/flutter#179208);
       an unstyled document renders that strip WHITE. Runtime theme switches are
       synced from Dart (lib/utils/web_document_background.dart). Inert CSS
       only — background-color never affects layout/scroll/viewport. */
    html, body { background-color: #F7F4F0; }
    /* Privacy curtain (passcode lock). Shown SYNCHRONOUSLY from the blur /
       visibilitychange handler below — a real screen-off gives 80–400 ms
       between blur and hidden (measured, Pixel_7 2026-09-06), which is not
       enough for a Flutter frame, and on wake the browser re-shows the last
       painted frame before any code runs. A DOM paint needs no Flutter frame.
       Also shown at boot when the passcode is enabled, so a lock's relaunch
       boots into this instead of a bare background. Dart lifts it once the
       gate has painted a known state (lib/utils/privacy_curtain_web.dart). */
    #fp-curtain { position: fixed; inset: 0; z-index: 2147483647;
      display: none; background-color: inherit; }
    #fp-curtain svg { position: absolute; top: 44px; left: 50%;
      transform: translateX(-50%); width: 64px; height: 56px; }
    /* Boot loader. The app shell (main.dart.js + CanvasKit wasm + fonts) is
       several MB and is served with `no-cache` (infra/nginx/fireplace.conf) and
       with NO offline service-worker cache (Flutter's generated SW self-
       unregisters since 3.x). So an idle-return or post-deploy launch re-fetches
       the whole shell over the network with nothing on screen; a daily user
       stays warm in the HTTP cache and never sees it, but a user returning after
       days waited on a bare background and assumed the app was broken. This
       inert DOM loader paints instantly (no Flutter frame needed) and is removed
       on `flutter-first-frame` (fp_boot.js). It sits one z-index
       BELOW #fp-curtain so a locked relaunch still shows the shield on top. */
    #fp-boot { position: fixed; inset: 0; z-index: 2147483646;
      display: flex; align-items: center; justify-content: center;
      background-color: inherit; color: #C2410C; }
    #fp-boot .fp-boot-inner { display: flex; flex-direction: column;
      align-items: center; opacity: 0;
      animation: fpBootIn .45s ease-out .2s forwards; }
    #fp-boot svg { width: 72px; height: 63px; }
    #fp-boot svg path { animation: fpBootPulse 1.9s ease-in-out infinite; }
    #fp-boot .fp-boot-bar { margin-top: 22px; width: 132px; height: 3px;
      border-radius: 3px; overflow: hidden;
      background-color: rgba(128, 128, 128, 0.18); }
    #fp-boot .fp-boot-bar > i { display: block; height: 100%; width: 6%;
      border-radius: 3px; background-color: currentColor;
      transition: width .35s cubic-bezier(.25, .8, .35, 1); }
    #fp-boot .fp-boot-label { margin-top: 16px; letter-spacing: .2px;
      font: 500 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: rgba(128, 128, 128, 0.85); }
    #fp-boot .fp-boot-hint { margin-top: 8px; max-width: 260px; text-align: center;
      opacity: 0; transition: opacity .4s ease;
      font: 400 12px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: rgba(128, 128, 128, 0.6); }
    @keyframes fpBootIn { to { opacity: 1; } }
    @keyframes fpBootPulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #fp-boot .fp-boot-inner { animation: none; opacity: 1; }
      #fp-boot svg path { animation: none; opacity: 1; }
      #fp-boot .fp-boot-bar > i { transition: none; } }
  </style>
  <script>
    // Pre-paint theme sync: the static #F7F4F0 above is the FRESH-INSTALL
    // default (Hot Stone). A returning user with a saved dark-family theme
    // would flash light during bundle load, so read the persisted preference
    // (shared_preferences web backend: localStorage, JSON-encoded under the
    // "flutter." prefix) synchronously and override BEFORE first paint.
    // Scaffold hexes must match RpgTheme.background* — drift is caught by
    // test/utils/web_document_background_test.dart.
    (function () {
      try {
        var read = function (key) {
          return (localStorage.getItem(key) || '').replace(/"/g, '');
        };
        var map = {
          dark: '#17181A',
          blue: '#17212B',
          cosmic: '#05070D',
          teal: '#FAFAF9',
          light: '#F7F4F0'
        };
        var theme = read('flutter.theme_preference');
        if (!map[theme]) {
          // Legacy ladder — mirrors SettingsProvider._resolveStoredTheme:
          // the Dart migration never writes theme_preference back, so
          // dark_mode_preference-only devices exist indefinitely.
          var legacy = read('flutter.dark_mode_preference');
          if (legacy === 'dark' || legacy === 'system') theme = 'dark';
          else if (legacy === 'light') theme = 'light';
        }
        var bg = map[theme];
        if (bg) {
          // No !important: Dart's runtime theme sync
          // (web_document_background_web.dart) writes INLINE styles, and an
          // author !important rule would beat them — pinning the bootstrap
          // color across later in-app theme switches. This later <style>
          // element outweighs the static rule above by order alone.
          var s = document.createElement('style');
          s.textContent =
            'html, body { background-color: ' + bg + '; }';
          document.head.appendChild(s);
        }
      } catch (e) { /* fresh-install default stays */ }
    })();
  </script>
  <script>
    // Privacy curtain — see the #fp-curtain comment above. `arm(true)` is
    // called from Dart while a passcode is enabled; only then do blur /
    // visibilitychange show it. Hiding is Dart's job (after the return
    // verdict; lifting it earlier would flash the chat before a lock lands).
    (function () {
      var armed = false;
      var el = null;
      // Mirrors RpgTheme.ephemeralAccent — pinned by
      // test/utils/web_document_background_test.dart.
      var accents = {
        dark: '#5C9EAD', blue: '#2AABEE', cosmic: '#8FD8FF',
        teal: '#0F766E', light: '#C2410C'
      };
      var node = function () {
        if (el) return el;
        el = document.getElementById('fp-curtain');
        return el;
      };
      var show = function () { var n = node(); if (n) n.style.display = 'block'; };
      var hide = function () { var n = node(); if (n) n.style.display = 'none'; };
      var onLeave = function () { if (armed) show(); };
      window.addEventListener('blur', onLeave);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState !== 'visible') onLeave();
      });
      window.__fpCurtain = {
        arm: function (on) { armed = !!on; },
        show: show,
        hide: hide
      };
      // Boot: a locked app's relaunch must not flash a bare background.
      try {
        if ((localStorage.getItem('flutter.passcode_enabled') || '') === 'true') {
          var theme = (localStorage.getItem('flutter.theme_preference') || '').replace(/"/g, '');
          document.addEventListener('DOMContentLoaded', function () {
            var svg = document.querySelector('#fp-curtain svg');
            if (svg) svg.setAttribute('stroke', accents[theme] || accents.light);
            show();
          });
        }
      } catch (e) { /* no curtain at boot */ }
    })();
  </script>
</head>
<body>
  <div id="fp-curtain" aria-hidden="true">
    <svg viewBox="0 0 64 56" fill="none" stroke="#C2410C" stroke-width="2">
      <path d="M32 2 L58 16 L58 40 L32 54 L6 40 L6 16 Z"/>
      <rect x="24" y="26" width="16" height="13" rx="2"/>
      <path d="M27 26 V21 a5 5 0 0 1 10 0 V26"/>
    </svg>
  </div>
  <div id="fp-boot" role="status" aria-live="polite">
    <div class="fp-boot-inner">
      <svg viewBox="0 0 64 56" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M32 2 L58 16 L58 40 L32 54 L6 40 L6 16 Z"/>
      </svg>
      <div class="fp-boot-bar"><i></i></div>
      <div class="fp-boot-label" id="fp-boot-label">Wczytywanie&#8230;</div>
      <div class="fp-boot-hint" id="fp-boot-hint"></div>
    </div>
  </div>
  <!-- Boot loader logic lives in fp_boot.js (EXTERNAL, same-origin). Kept out
       of an inline element so the prod CSP script-src stays 'self' with no
       third sha256 hash to maintain (infra/nginx/security-headers.conf,
       scripts/verify-csp-inline-hashes.mjs). Plain (not defer/async): it must
       run the instant #fp-boot is parsed. -->
  <script src="fp_boot.js"></script>
  <!-- Vendored jsQR (Apache-2.0) — fallback QR decoder for the link scanner
       (lib/widgets/link_qr_scanner_web.dart) when the browser lacks
       BarcodeDetector. Local by design: never a runtime CDN. `defer` keeps it
       off the critical path; the scanner probes `window.jsQR` before use. -->
  <script src="jsqr.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
