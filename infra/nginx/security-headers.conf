# Fireplace — security headers for the STATIC document locations.
#
# VM path: /etc/nginx/snippets/fireplace-security-headers.conf
# Included by: the `location /` (Flutter PWA) and `location ^~ /welcome/`
# (landing) blocks of /etc/nginx/sites-enabled/fireplace.
# Repo source of truth: infra/nginx/ (this dir). See
# .omp/rules/production-vm-deploy.md § "Static security headers".
#
# WHY ONLY THE STATIC BLOCKS: every /auth/, /users/, /messages/, /media/,
# /notes, /note/, /socket.io/, /health and /version response already carries
# helmet's full set from NestJS (backend/src/main.ts:30) — measured
# 2026-09-17: CSP, HSTS max-age=31536000, nosniff, X-Frame-Options SAMEORIGIN,
# Referrer-Policy no-referrer, COOP, CORP. Adding these at the server level
# would emit a SECOND, conflicting X-Frame-Options/CSP on every API response.
# The hole was always and only the nginx-served app shell + assets.
#
# NGINX TRAP: add_header in a location REPLACES the set inherited from the
# enclosing server block. There is deliberately no server-level add_header in
# sites-enabled/fireplace; both static locations declare their own
# `Cache-Control: no-cache` (the 2026-08-30/09-02 stale-page fix) alongside
# this include, at the same level, so the two sets accumulate. If a
# server-level add_header is ever introduced, re-declare it in both blocks.
#
# `always` so 404/5xx bodies are covered too — an unprotected error page is
# still a framable, sniffable document on this origin.

# Value mirrors helmet's (max-age=31536000; includeSubDomains) so the two
# halves of the origin never disagree. No `preload`: that is a one-way door
# (removal from the browser-baked list takes months) and buys little here.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;

# DENY, not SAMEORIGIN: nothing in this app is meant to be framed, and the
# origin holds the Signal keys plus both auth tokens in localStorage.
add_header X-Frame-Options "DENY" always;

add_header Referrer-Policy "no-referrer" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;

# Cross-Origin-Embedder-Policy is deliberately ABSENT: `require-corp` would
# block fonts.gstatic.com (no CORP header) and kill every webfont until the
# fonts are bundled locally. Revisit together with that change.

# camera=(self)  — link/QR scanner (lib/widgets/link_qr_scanner_web.dart)
# microphone=(self) — voice messages
# Everything listed as () is denied; features NOT listed keep their browser
# default (self), so this never silently disables something the app uses.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), display-capture=(), browsing-topics=(), idle-detection=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), xr-spatial-tracking=()" always;

# --- Content-Security-Policy: REPORT-ONLY, by design (2026-09-17) ---
#
# This is the exact policy intended for enforcement, so the report stream is
# the truth about what would break. Measured against the live bundle
# (0.2.48 / eefc44b0) in headless Chromium: the login surface loads only this
# origin + 6 files from fonts.gstatic.com.
#
# 'wasm-unsafe-eval'  — CanvasKit compiles /canvaskit/chromium/canvaskit.wasm.
#                       The wasm is LOCAL (deploy-web.ps1 --no-web-resources-cdn),
#                       but WebAssembly.compile still needs this token.
# two sha256 hashes    — the two pre-paint inline <script> blocks in
#                       frontend/web/index.html: the theme-flash killer and
#                       window.__fpCurtain (passcode privacy curtain). They
#                       must run before first paint, so they cannot be moved
#                       to `defer`. Drift is a CI-able failure, not a comment:
#                         node scripts/verify-csp-inline-hashes.mjs
# style-src 'unsafe-inline' — unavoidable: Flutter injects inline styles at
#                       runtime, and index.html's boot script appends a
#                       <style> element for the persisted theme colour.
# img-src https:      — link previews render og:image from arbitrary remote
#                       hosts (text_message_content.dart:207), and Giphy
#                       serves from media*.giphy.com. An allowlist is
#                       impossible; `https:` at least forbids http downgrade.
#                       Images cannot execute.
# connect-src         — 'self' covers the API and wss://<same origin>;
#                       fonts.gstatic.com is google_fonts fetching webfonts at
#                       runtime (fonts are NOT bundled — pubspec assets has
#                       sounds/icon/giphy only); api.giphy.com is the GIF
#                       picker.
# media-src blob:     — voice/video playback from decrypted object URLs.
# worker-src blob:    — Flutter service worker + CanvasKit workers.
#
# DELTAS WHEN FLIPPING TO ENFORCING (do not flip before both):
#   1. add `frame-ancestors 'none'` (ignored in report-only mode by spec;
#      X-Frame-Options: DENY above is what protects framing today);
#   2. drop the two sha256 hashes once the inline blocks move to a blocking
#      same-origin web/boot.js, leaving script-src 'self' 'wasm-unsafe-eval'.
# Enforcement also requires one logged-in pass (chat, GIF picker, voice,
# media, QR scan) in DESKTOP Chrome — a phone PWA has no console.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-GdALcgwmDM4Tk2PAaEgtXCSXjsvJtMCwmBsDmSsyBk0=' 'sha256-bgU5tsGADYFcWjpOVLbRQtJbrSjU2qlUaw2YPgGqVko='; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com https://api.giphy.com; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
