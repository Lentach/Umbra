# Fireplace — production HOST nginx vhost. SOURCE OF TRUTH for the VM file.
#
# VM path: /etc/nginx/sites-available/fireplace  (symlinked from sites-enabled/)
# Serves:  the Flutter PWA + landing from disk, and proxies the API to the
#          NestJS container on 127.0.0.1:3000 (+ fireplace-inbox on :3001).
#
# This file was UNTRACKED until 2026-09-17, which is why the app document ran
# with zero security headers for months while every proxied API response
# carried helmet's full set: nothing in the repo described the origin users
# actually load. `frontend/nginx.conf` is a DIFFERENT file — the container
# nginx used by docker-compose.yml / .staging.yml only; editing it changes
# nothing in production.
#
# Apply (on the VM, after `git pull`):
#   sudo cp /etc/nginx/sites-available/fireplace ~/nginx-fireplace.bak.$(date +%s)
#   sudo install -m 644 ~/fireplace/infra/nginx/security-headers.conf \
#        /etc/nginx/snippets/fireplace-security-headers.conf
#   sudo install -m 644 ~/fireplace/infra/nginx/fireplace.conf \
#        /etc/nginx/sites-available/fireplace
#   sudo nginx -t && sudo systemctl reload nginx
# Rollback: sudo cp ~/nginx-fireplace.bak.<epoch> /etc/nginx/sites-available/fireplace \
#           && sudo nginx -t && sudo systemctl reload nginx
# NEVER leave a backup inside sites-enabled/ — nginx loads it as live config
# (bit us in July with a "conflicting server name" vhost).
#
# Verify after any change (see .omp/rules/production-vm-deploy.md):
#   curl -sI https://fireplace.ignorelist.com/{,index.html,flutter.js,version.json}
#     -> cache-control: no-cache  AND  the security header set
#   curl -sI https://fireplace.ignorelist.com/health
#     -> helmet's headers ONLY, no duplicates

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fireplace.ignorelist.com;
    # No request log on the redirect either: a first hit over http is still
    # "this IP opened Umbra at this time".
    access_log off;
    return 301 https://$host$request_uri;
}

# HTTPS — Fireplace production
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fireplace.ignorelist.com;

    ssl_certificate     /etc/letsencrypt/live/fireplace.ignorelist.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fireplace.ignorelist.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/ubuntu/fireplace/frontend-build;
    index index.html;

    client_max_body_size 21m;

    # `Server: nginx` instead of `nginx/1.24.0 (Ubuntu)` — one less free hint
    # about which CVEs to try. Scoped to this vhost, not the global http block.
    server_tokens off;

    # No per-request log, by decision (2026-09-20, metadata-privacy step 0).
    # The combined access log was the most complete metadata record on the
    # box: client IP <-> socket connect time <-> every /media/msgs/<uuid>.bin
    # fetch <-> /auth/login, kept 14 rotations (~15 days). The DB after the
    # transient-queue cutover links none of that, so the log would have been
    # the only owner column for every attachment. `error_log` (global, level
    # `error`) stays: a few hundred bytes a day, no per-request trail. Abuse
    # visibility for the unauthenticated /box namespace comes from a
    # counter-only metric in the box module, never from an IP log.
    access_log off;

    # --- Backend API (NestJS on Docker host port 3000) ---
    #
    # NO add_header here, deliberately: NestJS `helmet()` already sets CSP,
    # HSTS, nosniff, X-Frame-Options, Referrer-Policy, COOP and CORP on every
    # proxied response. A second set from nginx would emit conflicting
    # duplicates. Static-only headers live in the two document blocks below.

    location /auth/ {
        proxy_pass http://127.0.0.1:3000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /users/ {
        proxy_pass http://127.0.0.1:3000/users/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /messages/ {
        proxy_pass http://127.0.0.1:3000/messages/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location = /media/upload {
        proxy_pass http://127.0.0.1:3000/media/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:3000/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }


    # Landing-page contact form + owner inbox -> standalone fireplace-inbox service (127.0.0.1:3001)
    location /contact {
        # The inbox key travels in ?key=; keep it out of the access log.
        access_log off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /notes {
        proxy_pass http://127.0.0.1:3000/notes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /note/ {
        proxy_pass http://127.0.0.1:3000/note/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Must NOT fall through to Flutter index.html
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /version {
        proxy_pass http://127.0.0.1:3000/version;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Landing marketing page (/welcome) -> static landing-build via alias
    location = /welcome { return 301 /welcome/; }
    location ^~ /welcome/ {
        alias /home/ubuntu/fireplace/landing-build/;
        add_header Cache-Control "no-cache";
        # Same level as the line above, so both sets apply (add_header only
        # replaces the set INHERITED from an outer block).
        include snippets/fireplace-security-headers.conf;
        index index.html;
    }
    # Sideloaded APK channel: the files Android's in-app update prompt
    # points at. Deliberately NOT under frontend-build - deploy-web.ps1
    # atomically REPLACES that directory, which would delete every
    # published APK.
    location ^~ /apk/ {
        alias /home/ubuntu/fireplace/apk/;
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=300";
        include snippets/fireplace-security-headers.conf;
        autoindex off;
    }

    # Flutter web (PWA) — last
    location / {
        # Flutter web output is NOT content-hashed: force ETag revalidation so
        # a deploy is picked up on the next load instead of hours later.
        add_header Cache-Control "no-cache";
        include snippets/fireplace-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
