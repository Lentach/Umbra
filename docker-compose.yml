# docker-compose.yml — LOCAL DEV ONLY (backend + DB for mobile dev).
# Backend runs bind-mounted in watch mode: NODE_ENV=development, relaxed CORS,
# TypeORM auto-DDL (synchronize). Frontend runs locally via: cd frontend && flutter run
# PRODUCTION (the VM) uses docker-compose.prod.yml via ./deploy-backend.sh — never this file.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatdb
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - '3000:3000'
    environment:
      # MUST be UTC — see the note in docker-compose.prod.yml. `expiresAt` is a
      # `timestamp WITHOUT time zone`, so a non-UTC backend ships deadlines
      # shifted by the host offset and the client destroys the only copy of
      # expired plaintext early. Verified: with the backend on a UTC+2 host the
      # 15-minute edit window also reads as expired immediately.
      TZ: UTC
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-chatdb}
      JWT_SECRET: ${JWT_SECRET:-my-super-secret-jwt-key-change-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:3000}
      MEDIA_DIR: /app/media
      # The box is OFF unless this is `true` (backend/src/app.module.ts). Dev and
      # CI's e2e stacks (this file) run it on; prod pins it off until the owner
      # turns it on after G5.
      BOX_ENABLED: ${BOX_ENABLED:-true}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-mailto:admin@example.com}
      APP_VERSION: ${APP_VERSION:-0.0.2}
      GIT_COMMIT: ${GIT_COMMIT:-dev}
      BUILD_TIME: ${BUILD_TIME:-}
      NODE_ENV: development
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./backend:/app
      - media_storage:/app/media
    command: sh -c "npm install && npm run start:dev"

volumes:
  pgdata:
  media_storage:
